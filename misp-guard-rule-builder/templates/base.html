<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MISP Guard Rule Builder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="/">MISP Guard Rule Builder</a></div>
  <div class="nav-links">
    <a href="/" class="nav-link active">Editor</a>
    <button class="btn btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme"><span class="theme-icon-dark">&#9790;</span><span class="theme-icon-light">&#9728;</span></button>
  </div>
</nav>
<main class="container">{% block content %}{% endblock %}</main>
<div id="toast-container"></div>
<script>
function toggleTheme(){const html=document.documentElement;const next=html.getAttribute('data-theme')==='light'?'dark':'light';html.setAttribute('data-theme',next);localStorage.setItem('theme',next)}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark')})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
